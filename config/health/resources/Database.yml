name: Database
abbreviation: db_load
checker: PragmaRX\Health\Checkers\Database
notify: true
column_size: 3
targets:
  - "query speed":
      type: "raw_query"
      connection: "default"
      query: "select created_at from audit_http_log u order by u.created_at desc limit 1"
      maximum_time: 1
      error_message: "Query took %sms when it should have last at most %sms"
