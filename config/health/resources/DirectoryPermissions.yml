name: Directory Permissions
abbreviation: dir_perms
checker: PragmaRX\Health\Checkers\Writable
notify: true
column_size: 3
error_message: "%s is not writable"
targets:
  - default:
      paths:
        - "{{ storage_path() }}"
        - "{{ storage_path('app') }}"
        - "{{ storage_path('framework') }}"
        - "{{ storage_path('logs') }}"
        - "{{ base_path('bootstrap') }}"
