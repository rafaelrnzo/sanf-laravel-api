version: '3.9'

networks:
    local-sanf-net:
        driver: bridge

volumes:
    local-sanf-net:
        driver: local
    postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: local-sanf-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sanf_sodium}
      POSTGRES_USER: ${DB_USERNAME:-sanf_sodium}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sanf_sodium_secret}
    networks:
      - local-sanf-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${CI_REGISTRY_IMAGE:-cr.nbs.dev/sanf/core/api}:local
    container_name: local-sanf-api
    build:
      context: './'
      dockerfile: './deployments/local/app/api/Dockerfile'
    ports:
      - ${APP_PORT:-8080}:80
    networks:
      - local-sanf-net
    env_file:
      - .env
    restart: 'no'
    volumes:
      - '.:/var/www/app:cached'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ${CI_REGISTRY_IMAGE:-cr.nbs.dev/sanf/core/worker}:local
    container_name: local-sanf-worker
    build:
      context: './'
      dockerfile: './deployments/local/app/worker/Dockerfile'
    networks:
      - local-sanf-net
    env_file:
      - .env
    restart: 'no'
    volumes:
      - '.:/var/www/app:cached'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cron:
    image: ${CI_REGISTRY_IMAGE:-cr.nbs.dev/sanf/core/cron}:local
    container_name: local-sanf-cron
    build:
      context: './'
      dockerfile: './deployments/local/app/cron/Dockerfile'
    networks:
      - local-sanf-net
    environment:
      CRON_BASE_URL: ${CRON_BASE_URL}
      CRON_CLIENT_ID: ${CRON_CLIENT_ID}
      CRON_CLIENT_SECRET: ${CRON_CLIENT_SECRET}
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

