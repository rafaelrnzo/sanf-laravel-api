stages:
  - lint

php-cs-fixer:lint:
  stage: lint
  image: php:7.4-cli-alpine
  before_script:
    - apk add --no-cache git
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  cache:
    key: ${CI_PROJECT_NAME}-composer-cache
    paths:
      - vendor/
      - ~/.composer/cache
  script:
    - composer install
      --no-cache
      --ignore-platform-reqs
      --optimize-autoloader
      --no-progress
      --no-interaction
      --no-plugins
      --no-scripts
      --prefer-dist
    - composer smell
  after_script:
    - composer clear-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    # - m.large
    - m.medium

php-stan:lint:
  stage: lint
  image: php:7.4-cli-alpine
  before_script:
    - apk add --no-cache git
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  cache:
    key: ${CI_PROJECT_NAME}-composer-cache
    paths:
      - vendor/
      - ~/.composer/cache
  script:
    - composer install
      --no-cache
      --ignore-platform-reqs
      --optimize-autoloader
      --no-progress
      --no-interaction
      --no-plugins
      --no-scripts
      --prefer-dist
    - composer stan
  after_script:
    - composer clear-cache
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  when: manual
  tags:
    # - m.large
    - m.medium

sonarqube:lint:
  stage: lint
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [ "" ]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - cp ${SONAR_PROPERTIES} sonar-project.properties
  script:
    - sonar-scanner
  allow_failure: true
  environment:
    name: development
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  when: manual
  tags:
    # - m.large
    - m.medium
