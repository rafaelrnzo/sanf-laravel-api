[opcache]

; Reference: https://www.php.net/manual/en/opcache.configuration.php

opcache.preload=/var/www/app/preload.php

opcache.preload_user = www-data

; Read more here - https://www.scalingphpbook.com/best-zend-opcache-settings-tuning-config/
; A few settings are configured by environment variables so that
; different environments can be tweaked in docker easily.

opcache.enable=1

; Not sure if `opcache.enable_cli` is necessary until more research
; opcache.enable_cli=1

; How often (in seconds) the code cache expire and check if code has changed
; 0 means it will check on every request
; 0 is irrelevant if opcache.validate_timestamps=0 which is desirable in production
opcache.revalidate_freq=0

; 0 or 1. 0 is recommended in production, and will require a restart when files change.
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}

; Keep this above the number of files in project
; Check PHP files to preload
; `find . -type f -print | grep php | wc -l`
opcache.max_accelerated_files=${PHP_OPCACHE_MAX_ACCELERATED_FILES}

; How much memory opcache is allowed to use
; default:
; opcache.memory_consumption=64
opcache.memory_consumption=${PHP_OPCACHE_MEMORY_CONSUMPTION}

; Caches duplicate strings into one shared immutable value
; A pretty neat setting with like 0 documentation.
; PHP uses a technique called string interning to improve performance—
; so, for example, if you have the string "foobar" 1000 times in your code,
; internally PHP will store 1 immutable variable for this string
; and just use a pointer to it for the other 999 times you use it.
; Cool. This setting takes it to the next level—
; instead of having a pool of these immutable string for each SINGLE php-fpm process,
; this setting shares it across ALL of your php-fpm processes.
; It saves memory and improves performance, especially in big applications
opcache.interned_strings_buffer=16

; What this actually does is provide a faster mechanism
; for calling the deconstructors in your code at the end of a single request
; to speed up the response and
; recycle php workers so they’re ready for the next incoming request faster.
opcache.fast_shutdown=1
