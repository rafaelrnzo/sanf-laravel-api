[xdebug]
; Xdebug 3.x configuration — https://xdebug.org/docs/all_settings
;
; Xdebug 3 dropped the old 2.x directives (xdebug.remote_enable,
; xdebug.remote_host, xdebug.remote_port, xdebug.remote_autostart,
; xdebug.remote_connect_back). They are replaced by the settings below.
;
; To disable Xdebug entirely, set PHP_XDEBUG_MODE=off in your .env
; (this is the recommended default — Xdebug adds noticeable overhead).
; Common modes: off | debug | profile | develop | coverage (comma-separated).
xdebug.mode = ${PHP_XDEBUG_MODE}

; IDE / debugger client connection
xdebug.client_host = ${PHP_XDEBUG_CLIENT_HOST}
xdebug.client_port = ${PHP_XDEBUG_CLIENT_PORT}
xdebug.discover_client_host = ${PHP_XDEBUG_DISCOVER_CLIENT_HOST}
xdebug.start_with_request = ${PHP_XDEBUG_START_WITH_REQUEST}
xdebug.idekey = ${PHP_XDEBUG_IDEKEY}

; Profiler / trace output location (used when mode includes "profile")
xdebug.output_dir = ${PHP_XDEBUG_OUTPUT_DIR}

; Set to a higher value (e.g. 7) only when troubleshooting the Xdebug connection
xdebug.log_level = 0
